[project]
name = "datalume-api"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy>=2.0.54",
  "alembic>=1.20.0",
  "psycopg[binary]>=3.3.6",
  "pydantic[email]>=2.13.5",
  "pydantic-settings>=2.15.0",
  "bcrypt>=5.0.0",
  "redis>=8.1.0",
  "python-multipart>=0.0.32",
  "structlog>=26.1.0",
  "anthropic>=1.11.0",
  "reportlab>=5.0.1",
  "openpyxl>=3.1.5",
  "stripe>=16.0.0",
  "pyotp>=2.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"
