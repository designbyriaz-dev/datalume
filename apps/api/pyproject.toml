[project]
name = "datalume-api"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "bcrypt>=4.1",
  "redis>=5.0",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "anthropic>=0.40",
  "reportlab>=4.2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
