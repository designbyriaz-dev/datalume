name: CI

# Closes the gap STATUS.md documented: "No CI pipeline wired up yet
# (backend pytest + frontend build/lint/test should all gate merges
# once this repo has a remote)." It now has one.
#
# The api/web/e2e jobs below need no Postgres/Redis service containers
# — everything (including the e2e job's two live servers) runs entirely
# against SQLite + an in-process fake Redis (see
# apps/api/app/tests/conftest.py and apps/api/scripts/
# run_smoketest_server.py), the same pattern used for every live
# smoketest verification throughout this build.
#
# The rls job is different on purpose: Row Level Security is a real
# Postgres feature SQLite cannot emulate at all, so it runs against an
# actual postgres: service container, applies the real Alembic chain,
# and runs app/tests/test_rls_postgres.py for real — see that module's
# own docstring. This closed STATUS.md's long-standing "RLS is
# unverified against real Postgres" gap and, doing so, found two real
# bugs neither SQLite nor this repo's own local dev loop (never run
# against real Postgres until Docker/Postgres finally became available)
# had ever been able to surface — see that commit for detail.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # the version this build was actually developed/verified against
      - run: pip install -e ".[dev]"
      - run: pytest -q

  web:
    name: Web build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: apps/api
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  rls:
    name: Postgres RLS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # The official postgres image's own POSTGRES_USER becomes the
    # initdb superuser — and RLS (FORCE ROW LEVEL SECURITY included)
    # never applies to a superuser, full stop, no exception. Using that
    # directly as the app's DATABASE_URL role would make every policy a
    # silent no-op, which is exactly what happened the first time this
    # job ran (see commit history: all three assertions in
    # test_a_tenant_scoped_session_only_sees_its_own_organisations_rows
    # passed locally against a genuine non-superuser role, then failed
    # here against the bootstrap superuser). The service stays on the
    # default postgres/postgres superuser for bootstrapping only; a
    # dedicated step below creates `datalume` as a real, unprivileged
    # LOGIN role and database, matching what a real deployment must
    # also do — the app's own connection role should never be a
    # superuser, or this same silent bypass applies in production too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://datalume:datalume@localhost:5432/datalume
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Create non-superuser app role and database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c \
            "CREATE ROLE datalume LOGIN PASSWORD 'datalume';"
          PGPASSWORD=postgres psql -h localhost -U postgres -c \
            "CREATE DATABASE datalume OWNER datalume;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c \
            "SELECT rolname, rolsuper FROM pg_roles WHERE rolname = 'datalume';"
      - run: python -m alembic upgrade head
      - run: pytest -q app/tests/test_rls_postgres.py
